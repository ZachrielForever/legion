name: Build Dominus Image

on:
  push:
    branches: [main]
    paths:
      - 'instrumentum/dominus/**'
      - '.github/workflows/build-dominus.yml'

env:
  REGISTRY: ghcr.io
  OWNER: zachrielforever
  USERNAME: ${{ github.actor }}
  PASSWORD: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build-dominus:
    name: Build Dominus
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Container
        run: |
          podman build -t ${REGISTRY}/${OWNER}/dominus:stable \
            -f instrumentum/dominus/Containerfile \
            instrumentum/dominus/

      - name: Login to GHCR
        run: echo "${PASSWORD}" | podman login ${REGISTRY} -u ${USERNAME} --password-stdin

      - name: Login to GHCR
        run: podman login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

      - name: Sign with Cosign
        run: cosign sign --yes ${REGISTRY}/${OWNER}/dominus:stable