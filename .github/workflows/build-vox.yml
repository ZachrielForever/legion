---
name: Build vox image
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '45 10 * * *'  # 10:45am UTC daily
  push:
    branches:
      - main
    paths:
      - "turma/vox/**"
      - ".github/workflows/build-vox.yml"
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  IMAGE_NAME: "l-turma"
  DEFAULT_TAG: "vox"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-26.04

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      # Installed unconditionally and early: chunkah's verification pass
      # runs on every build (incl. PRs), unlike rechunker-era flows.
      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          # be careful when upgrading major versions
          cosign-release: 'v3.1.2'

      - name: Check Just Syntax
        shell: bash
        run: |
          just check

      - name: Image Name
        id: image-name
        run: |
          IMAGE_NAME=$(just image_name)

          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV

      - name: Default Tag
        id: gen-default-tag
        run: |
          DEFAULT_TAG=$(just generate-default-tag)

          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> $GITHUB_ENV

      - name: Prepare environment
        run: |
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # This actually builds the container image
      - name: Build Image
        id: build-image
        run: |
          just build \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG} \
            turma/vox

      # Reprocess the raw build with chunkah for content-based layers.
      # Mirrors ublue-os/bazzite build.py cmd_rechunk. No --privileged needed.
      - name: Run Chunkah
        id: rechunk
        env:
          # Pinned digest, same as bazzite's build.py default
          CHUNKAH_IMAGE: "quay.io/coreos/chunkah:latest@sha256:8b56578258d1d10d3e1c7b0f71a4d05317c5fde331c4f483576a1b60e65f0cea"
        run: |
          set -euo pipefail
          RAW_IMAGE="localhost/${IMAGE_NAME}:${DEFAULT_TAG}"

          # 1. Empty /run and /tmp contents (keep the dirs) in the raw image
          buildah unshare bash -euo pipefail -c '
            ctr=$(buildah from --pull=never "$1")
            mnt=$(buildah mount "$ctr")
            find "$mnt/run" -mindepth 1 -delete
            find "$mnt/tmp" -mindepth 1 -delete
            buildah unmount "$ctr"
            buildah commit "$ctr" "$1"
            buildah rm "$ctr"
          ' bash "${RAW_IMAGE}"

          # 2-3. Pull chunkah pinned, resolve digest, cosign-verify
          podman pull "${CHUNKAH_IMAGE}"
          chunkah_ref=$(podman image inspect \
            --format "{{index .RepoDigests 0}}" "${CHUNKAH_IMAGE}")
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github\.com/coreos/chunkah/" \
            "${chunkah_ref}"

          # 4-6. Carry config over, strip stale labels, compose chunked image
          OUT_DIR="${RUNNER_TEMP}/chunkah-out"
          mkdir -p "${OUT_DIR}"
          podman image inspect "${RAW_IMAGE}" > "${OUT_DIR}/chunkah-config.json"

          podman run --rm --pull=never \
            --mount=type=image,src=${RAW_IMAGE},target=/chunkah \
            --volume "${OUT_DIR}/chunkah-config.json:/chunkah-config.json:ro,Z" \
            --volume "${OUT_DIR}:/run/out:Z" \
            "${chunkah_ref}" \
            build --verbose \
            --max-layers 256 \
            --prune /sysroot/ \
            --label ostree.commit- \
            --label ostree.final-diffid- \
            --config /chunkah-config.json \
            --output oci:/run/out/chunked

          # 7. Consume raw image, re-tag chunked output in its place so
          # downstream tag-images/push steps keep working unchanged
          podman rmi -f "${RAW_IMAGE}" || true
          chunked_id=$(podman pull "oci:${OUT_DIR}/chunked")
          podman tag "${chunked_id}" "${RAW_IMAGE}"

          echo "ref=containers-storage:${RAW_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          alias_tags="$(just generate-build-tags \
                        ${IMAGE_NAME} \
                        ${DEFAULT_TAG})"

          echo "Tags for this Action..."
          echo "${alias_tags}"
          echo "alias_tags=${alias_tags}" >> $GITHUB_OUTPUT

      - name: Tag Image
        id: tag-images
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          just tag-images \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}" \
            "${ALIAS_TAGS}"

      # These `if` statements are so that pull requests for your custom images do not make it publish any packages under your name without you knowing
      # They also check if the runner is on the default branch so that things like the merge queue (if you enable it), are going to work
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euox pipefail
          for tag in ${ALIAS_TAGS}; do
            podman push --digestfile=/tmp/digestfile ${IMAGE_NAME}:${tag} ${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}
          done

          digest=$(< /tmp/digestfile)

          echo "digest=${digest}" >> $GITHUB_OUTPUT

      # This section is optional and only needs to be enabled if you plan on distributing
      # your project for others to consume. You will need to create a public and private key
      # using Cosign and save the private key as a repository secret in Github for this workflow
      # to consume. For more details, review the image signing section of the README.

      - name: Sign container image
        id: sign-image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          # https://github.com/containers/container-libs/issues/388
          # https://github.com/coreos/rpm-ostree/issues/5509
          # use old bundle format, so we can use newer cosign 3.X.X instead of 2.X.X
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}

