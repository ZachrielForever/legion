---
name: Build helius image

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - "helius/**"
      - ".github/workflows/build-helius.yml"
  schedule:
    # Upstream digest watch: 06:00 and 18:00 UTC
    - cron: '0 6,18 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force rebuild regardless of upstream digest'
        type: boolean
        default: false

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  IMAGE_NAME: "helius"
  DEFAULT_TAG: "stable"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  # write is needed only for recording helius/.upstream-digest;
  # everything else matches the fleet default of contents: read
  contents: write
  packages: write
  id-token: write

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-26.04

    steps:
      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      - name: Check upstream base digest
        id: upstream
        run: |
          UPSTREAM=$(skopeo inspect docker://ghcr.io/ublue-os/bazzite-dx-nvidia:stable | jq -r '.Digest')
          CURRENT=$(cat helius/.upstream-digest 2>/dev/null || echo "none")
          echo "Upstream: ${UPSTREAM}"
          echo "Last built: ${CURRENT}"
          if [[ "${UPSTREAM}" == "${CURRENT}" ]]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "${UPSTREAM}" > helius/.upstream-digest
          fi

      # Build gate: scheduled runs build only when upstream moved;
      # pushes, PRs, and forced dispatches always build (fleet behavior)
      - name: Check Just Syntax
        if: github.event_name != 'schedule' || steps.upstream.outputs.changed == 'true' || inputs.force == true
        shell: bash
        run: |
          just check

      - name: Image Name
        id: image-name
        if: github.event_name != 'schedule' || steps.upstream.outputs.changed == 'true' || inputs.force == true
        run: |
          IMAGE_NAME=$(just image_name)
          echo "IMAGE_NAME=${IMAGE_NAME}" >> ${GITHUB_ENV}

      - name: Default Tag
        id: gen-default-tag
        if: github.event_name != 'schedule' || steps.upstream.outputs.changed == 'true' || inputs.force == true
        run: |
          DEFAULT_TAG=$(just generate-default-tag)
          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> ${GITHUB_ENV}

      - name: Prepare environment
        if: github.event_name != 'schedule' || steps.upstream.outputs.changed == 'true' || inputs.force == true
        run: |
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        if: github.event_name != 'pull_request' && (github.event_name != 'schedule' || steps.upstream.outputs.changed == 'true' || inputs.force == true)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # This actually builds the container image
      - name: Build Image
        id: build-image
        if: github.event_name != 'schedule' || steps.upstream.outputs.changed == 'true' || inputs.force == true
        run: |
          just build \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG} \
            helius

      # This is optional, this provides smaller delta updates
      - name: Rechunk with rpm-ostree
        id: rechunk
        if: github.event_name != 'schedule' || steps.upstream.outputs.changed == 'true' || inputs.force == true
        run: |
          just ostree-rechunk \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      - name: Generate Build Tags
        id: gen-build-tags
        if: github.event_name != 'schedule' || steps.upstream.outputs.changed == 'true' || inputs.force == true
        run: |
          alias_tags="$(just generate-build-tags \
                        ${IMAGE_NAME} \
                        ${DEFAULT_TAG})"

          echo "Tags for this Action..."
          echo "${alias_tags}"
          echo "alias_tags=${alias_tags}" >> $GITHUB_OUTPUT

      - name: Tag Image
        id: tag-images
        if: github.event_name != 'schedule' || steps.upstream.outputs.changed == 'true' || inputs.force == true
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          just tag-images \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}" \
            "${ALIAS_TAGS}"

      # These `if` statements are so that pull requests for your custom images do not make it publish any packages under your name without you knowing
      # They also check if the runner is on the default branch so that things like the merge queue (if you enable it), are going to work
      - name: Login to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name != 'schedule' || steps.upstream.outputs.changed == 'true' || inputs.force == true)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name != 'schedule' || steps.upstream.outputs.changed == 'true' || inputs.force == true)
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euox pipefail
          for tag in ${ALIAS_TAGS}; do
            podman push --digestfile=/tmp/digestfile ${IMAGE_NAME}:${tag} ${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}
          done

          digest=$(< /tmp/digestfile)

          echo "digest=${digest}" >> $GITHUB_OUTPUT

      - name: Sign the image with Cosign
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name != 'schedule' || steps.upstream.outputs.changed == 'true' || inputs.force == true)
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          # be careful when upgrading major versions
          cosign-release: 'v3.1.2'

      - name: Sign container image
        id: sign-image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name != 'schedule' || steps.upstream.outputs.changed == 'true' || inputs.force == true)
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_EXPERIMENTAL: false
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          # https://github.com/containers/container-libs/issues/388
          # https://github.com/coreos/rpm-ostree/issues/5509
          # use old bundle format, so we can use newer cosign 3.X.X instead of 2.X.X
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}

      # Record the digest only after a fully successful build/push/sign,
      # only from the default branch, never from PRs
      - name: Record Built Digest
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name != 'schedule' || steps.upstream.outputs.changed == 'true' || inputs.force == true)
        run: |
          git config user.name "legion-automation"
          git config user.email "legion-automation@users.noreply.github.com"
          git add helius/.upstream-digest
          git commit -m "helius: record upstream digest" || exit 0
          git push