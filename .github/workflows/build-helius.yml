name: Build Helius Image

on:
  push:
    branches: [main]
    paths:
      - 'helius/**'
      - '.github/workflows/build-helius.yml'
  schedule:
    # Upstream digest watch: 06:00 and 18:00 UTC
    - cron: '0 6,18 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force rebuild regardless of upstream digest'
        type: boolean
        default: false

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  IMAGE_NAME: "helius"
  DEFAULT_TAG: "stable"
  IMAGE_DESC: "legion helius - daily driver, thin mask over bazzite-dx-nvidia"
  IMAGE_KEYWORDS: "bootc,ublue,bazzite,helius"
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"

concurrency:
  group: build-helius
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build-helius:
    name: Build Helius
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check upstream base digest
        id: upstream
        run: |
          UPSTREAM=$(skopeo inspect docker://ghcr.io/ublue-os/bazzite-dx-nvidia:stable | jq -r '.Digest')
          CURRENT=$(cat helius/.upstream-digest 2>/dev/null || echo "none")
          echo "Upstream: ${UPSTREAM}"
          echo "Last built: ${CURRENT}"
          if [[ "${UPSTREAM}" == "${CURRENT}" ]]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "${UPSTREAM}" > helius/.upstream-digest
          fi

      # ---------------------------------------------------------------
      # Build steps run only when upstream moved or a force was requested
      # ---------------------------------------------------------------

      - name: Image Name
        if: steps.upstream.outputs.changed == 'true' || inputs.force == true
        run: |
          IMAGE_NAME=$(just image_name)
          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV

      - name: Generate Default Tag
        if: steps.upstream.outputs.changed == 'true' || inputs.force == true
        run: |
          DEFAULT_TAG=$(just generate-default-tag)
          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> $GITHUB_ENV

      - name: Just Check Syntax
        if: steps.upstream.outputs.changed == 'true' || inputs.force == true
        run: just check helius

      - name: Build Image
        if: steps.upstream.outputs.changed == 'true' || inputs.force == true
        run: just build helius

      - name: Tag Images
        if: steps.upstream.outputs.changed == 'true' || inputs.force == true
        run: just tag-images

      - name: Login to GHCR
        if: steps.upstream.outputs.changed == 'true' || inputs.force == true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        if: steps.upstream.outputs.changed == 'true' || inputs.force == true
        run: just push-images

      - name: Install Cosign
        if: steps.upstream.outputs.changed == 'true' || inputs.force == true
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v3.1.2'

      - name: Sign Image
        if: steps.upstream.outputs.changed == 'true' || inputs.force == true
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          cosign sign --key env://COSIGN_PRIVATE_KEY \
            ghcr.io/${{ github.repository_owner }}/helius:stable

      # ---------------------------------------------------------------
      # Record the digest only after a fully successful build/push/sign
      # ---------------------------------------------------------------

      - name: Record Built Digest
        if: steps.upstream.outputs.changed == 'true' || inputs.force == true
        run: |
          git config user.name "legion-automation"
          git config user.email "legion-automation@users.noreply.github.com"
          git add helius/.upstream-digest
          git commit -m "helius: record upstream digest $(git rev-parse --short HEAD)" || exit 0
          git push