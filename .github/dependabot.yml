# To reduce Actions-tab noise and PR pileup, updates are checked on a
# relaxed cadence and grouped. Configuration reference:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Chicago"
    groups:
      actions-versions:
        patterns: ["*"]
    open-pull-requests-limit: 5
