# lumen: only zachriel, keys only. Tailnet-only is enforced by
# the firewalld tailnet zone (source 100.64.0.0/10), not here -
# sshd cannot bind a CIDR, and a literal node IP does not
# belong in a fleet image.
AllowUsers zachriel
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no